name: release

# Reusable release/publish workflow for Apius Splunk apps (ADR-0004 / ADR-0005).
# It builds the Splunkbase package at the released version, runs Splunk
# AppInspect via the AppInspect API, and publishes a GitHub Release with the
# packaged .tar.gz and auto-generated notes.
#
# Callers trigger it either way (see the `resolve` job):
#   * auto (preferred) — on push to main, omitting `version`. The merged Release
#     PR is the trigger, the version comes from the stamped app.conf, and the
#     tag is created here by `gh release create --target`. No manual tag push,
#     and no PAT: a tag pushed with GITHUB_TOKEN would not trigger a workflow.
#   * tag (legacy) — on a pushed vX.Y.Z tag, passing the stripped version.
#
# AppInspect (ADR-0005): base (non-cloud) errors/failures BLOCK the release;
# cloud findings are ADVISORY by default and only block when cloud_gate=true.
# The base and cloud vettings run as two steps so blocking can be controlled
# per-tag-set: the base step always blocks (the action's failOnError is
# hardcoded true), while the cloud step is made advisory via step-level
# continue-on-error unless cloud_gate is set.
#
# After the GitHub Release, an optional gated `splunkbase` job publishes the
# same package to Splunkbase (ADR-0006, slice #6). It runs inside the caller
# repo's `splunkbase` Environment, so a required reviewer there is the manual
# approval gate. It is skipped entirely when `splunkbase_app_id` is empty (no
# listing yet) so the pipeline stays green and the first publish stays manual.
#
# Human release flow, auto trigger (see also prepare-release.yml):
#   1. Dispatch prepare-release with the target version.
#   2. Merge the "Release vX.Y.Z" PR -> this workflow runs, tags, releases.
#   3. Approve the `splunkbase` deployment to publish (or leave it unapproved).
on:
  workflow_call:
    inputs:
      app_id:
        description: "Splunk app id; also the app directory to package/inspect."
        required: true
        type: string
      version:
        description: >-
          Release version X.Y.Z (no leading v). Optional: when empty the version
          is read from the app's stamped app.conf [launcher] version, which is
          what the auto trigger (caller on push to main) uses. Tag-triggered
          callers pass the version stripped from the tag name.
        required: false
        default: ""
        type: string
      cloud_gate:
        description: "When true, AppInspect cloud findings block the release; otherwise advisory."
        required: false
        type: boolean
        default: false
      python_version:
        description: "Python version used for the packaging tooling."
        required: false
        type: string
        default: "3.9"
      splunkbase_app_id:
        description: >-
          Numeric Splunkbase app id (listing) to publish to. Empty (the
          default) skips the Splunkbase publish job entirely: an app with no
          listing yet does not fail the pipeline, and its first publish is done
          manually to create the listing.
        required: false
        type: string
        default: ""
      splunk_versions:
        description: >-
          Comma-separated Splunk versions the release is compatible with, sent
          as the Splunkbase Release API `splunk_versions` field (required by
          the API). No default: every caller must declare its own real
          compatibility explicitly. A blanket fleet default is unsafe -- it
          would silently claim support for versions the app has not been
          validated against (e.g. Splunk 9.0/9.1 ship Python 3.7) and omit
          newer 10.x releases.
        required: true
        type: string
      cim_versions:
        description: >-
          Optional comma-separated CIM versions, sent as the `cim_versions`
          field. Omitted from the upload when empty.
        required: false
        type: string
        default: ""
      visibility:
        description: >-
          Splunkbase release `visibility` flag. When true, the approved release
          is made publicly visible on the listing.
        required: false
        type: string
        default: "true"
    secrets:
      SPLUNK_USER:
        description: "splunk.com service-account user for the AppInspect and Splunkbase Release APIs."
        required: true
      SPLUNK_PASS:
        description: "splunk.com service-account password for the AppInspect and Splunkbase Release APIs."
        required: true

permissions:
  contents: write

jobs:
  # Resolve the version to release and decide whether there is anything to do.
  #
  # Two trigger shapes are supported so apps can migrate independently:
  #   * auto (preferred)  — caller runs on push to main and omits `version`.
  #     The version comes from the stamped app.conf, and the release is skipped
  #     unless that version has no tag yet, so ordinary main pushes are no-ops
  #     and a re-run cannot double-release.
  #   * tag (legacy)      — caller runs on a pushed vX.Y.Z tag and passes the
  #     stripped version. Always releases; the tag already exists.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      should_release: ${{ steps.resolve.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Fetch packaging tooling
        uses: actions/checkout@v4
        with:
          repository: apius-tech/splunk-app-ci
          ref: main
          path: .splunk-app-ci

      - name: Resolve version and decide whether to release
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          APP_ID: ${{ inputs.app_id }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            echo "Version from caller input: $version"
          else
            version="$(PYTHONPATH=.splunk-app-ci python -m splunk_app_ci current-version \
              --app-conf "${APP_ID}/default/app.conf")"
            echo "Version read from ${APP_ID}/default/app.conf: $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$REF_TYPE" = "tag" ]; then
            echo "Tag-triggered run — releasing v${version}."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already tagged — nothing to release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} has no tag yet — releasing."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: resolve
    if: ${{ needs.resolve.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Fetch packaging tooling
        uses: actions/checkout@v4
        with:
          repository: apius-tech/splunk-app-ci
          ref: main
          path: .splunk-app-ci

      # Build the Splunkbase artifact at the released version into dist/. The
      # AppInspect API action globs the directory, so dist/ holds only this
      # single tarball.
      - name: Build package
        run: >
          PYTHONPATH=.splunk-app-ci python -m splunk_app_ci package
          --app-dir "${{ inputs.app_id }}"
          --version "${{ needs.resolve.outputs.version }}"
          --dest dist

      # Base (non-cloud) vetting. failOnError is hardcoded true in the action,
      # so any error/failure here BLOCKS the release.
      - name: AppInspect API (base checks, blocking)
        uses: splunk/appinspect-api-action@v3.0.5
        with:
          username: ${{ secrets.SPLUNK_USER }}
          password: ${{ secrets.SPLUNK_PASS }}
          app_path: dist
          excluded_tags: "manual,cloud"

      - name: Upload base AppInspect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appinspect-base-report
          path: AppInspect_response.html
          if-no-files-found: warn

      # Cloud vetting. included_tags: cloud runs only the cloud checks. The
      # step is advisory (continue-on-error) unless cloud_gate is true, in
      # which case cloud findings block the release.
      - name: AppInspect API (cloud vetting, advisory unless cloud_gate)
        continue-on-error: ${{ !inputs.cloud_gate }}
        uses: splunk/appinspect-api-action@v3.0.5
        with:
          username: ${{ secrets.SPLUNK_USER }}
          password: ${{ secrets.SPLUNK_PASS }}
          app_path: dist
          included_tags: cloud

      - name: Upload cloud AppInspect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appinspect-cloud-report
          path: AppInspect_response.html
          if-no-files-found: warn

      # Hand the inspected bytes to the Splunkbase job instead of having it
      # rebuild. build_package normalizes ownership but tarfile's gzip header
      # carries a fresh mtime, so a rebuild is not byte-identical: promoting
      # this artifact is what makes the published package provably the one that
      # passed AppInspect.
      - name: Upload release package for promotion
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*.tar.gz
          if-no-files-found: error

      # Publish the GitHub Release with the packaged artifact and auto-generated
      # notes. Reached only when the base checks (and, under cloud_gate, cloud
      # checks) passed.
      #
      # --target creates the tag when it does not exist yet, which is what makes
      # the auto trigger work without a second push event: a tag pushed by
      # GITHUB_TOKEN would not trigger `on: push: tags` at all, so the tag is
      # minted here rather than pushed from a job. On a tag-triggered run the tag
      # already points at this commit and --target is a no-op.
      - name: Create GitHub Release (creates the tag when absent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ needs.resolve.outputs.version }}"
          dist/*.tar.gz
          --target "${{ github.sha }}"
          --title "v${{ needs.resolve.outputs.version }}"
          --generate-notes

  # Gated Splunkbase publish (ADR-0006, slice #6). Runs only after the GitHub
  # Release job and only when a listing exists (splunkbase_app_id is set).
  #
  # The manual gate: `environment: splunkbase` is resolved against the CALLER
  # repo, whose `splunkbase` Environment has a required reviewer. GitHub holds
  # this job (before any step runs) until a reviewer approves, and the publish
  # credentials are scoped to that environment in the caller.
  #
  # The "no listing yet -> skip, don't fail" guard is the job-level `if`: when
  # splunkbase_app_id is empty the whole job is skipped, so the pipeline stays
  # green AND no reviewer is asked to approve a no-op. The first step re-states
  # the target for the log and hard-stops with guidance if it is somehow reached
  # empty. Only the read-only status poll loops; the upload POSTs exactly once
  # to respect the Release API limit of <=20 POST/hour.
  splunkbase:
    needs: [resolve, release]
    if: ${{ inputs.splunkbase_app_id != '' }}
    runs-on: ubuntu-latest
    environment: splunkbase
    steps:
      - name: Confirm Splunkbase target
        run: |
          if [ -z "${{ inputs.splunkbase_app_id }}" ]; then
            echo "No SPLUNKBASE_APP_ID set — first publish is manual; skipping Splunkbase upload."
            echo "Create the Splunkbase listing manually, then set the SPLUNKBASE_APP_ID repo variable."
            exit 1
          fi
          echo "Publishing ${{ inputs.app_id }}-${{ needs.resolve.outputs.version }} to Splunkbase app id ${{ inputs.splunkbase_app_id }} (pending environment approval)."

      # Promote the exact artifact the release job inspected and attached to the
      # GitHub Release — no rebuild, so the published bytes cannot drift from the
      # inspected ones.
      - name: Download the released package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist

      # Upload via the Splunkbase Release API (new_release) with HTTP Basic auth,
      # then poll the package status endpoint until it reports pass/fail.
      - name: Upload to Splunkbase and poll status
        env:
          SPLUNK_USER: ${{ secrets.SPLUNK_USER }}
          SPLUNK_PASS: ${{ secrets.SPLUNK_PASS }}
          SB_APP_ID: ${{ inputs.splunkbase_app_id }}
          APP_ID: ${{ inputs.app_id }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SPLUNK_VERSIONS: ${{ inputs.splunk_versions }}
          CIM_VERSIONS: ${{ inputs.cim_versions }}
          VISIBILITY: ${{ inputs.visibility }}
        run: |
          set -euo pipefail

          tarball="dist/${APP_ID}-${VERSION}.tar.gz"
          if [ ! -f "$tarball" ]; then
            echo "Expected package not found: $tarball" >&2
            ls -la dist >&2 || true
            exit 1
          fi
          echo "Uploading $tarball to Splunkbase app ${SB_APP_ID}."

          # splunk_versions and visibility are required; cim_versions is sent
          # only when provided.
          form_args=(
            -F "files[]=@${tarball}"
            -F "filename=$(basename "$tarball")"
            -F "splunk_versions=${SPLUNK_VERSIONS}"
            -F "visibility=${VISIBILITY}"
          )
          if [ -n "${CIM_VERSIONS}" ]; then
            form_args+=(-F "cim_versions=${CIM_VERSIONS}")
          fi

          # Single POST only — the Release API allows <=20 POST/hour, so the
          # upload is never retried; only the read-only GET poll loops below.
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -u "${SPLUNK_USER}:${SPLUNK_PASS}" \
            --request POST \
            "https://splunkbase.splunk.com/api/v1/app/${SB_APP_ID}/new_release/" \
            "${form_args[@]}")"

          echo "new_release HTTP ${code}"
          cat "$body"; echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "Splunkbase upload failed (HTTP ${code})." >&2
            exit 1
          fi

          # The new_release response may already carry result=pass and always
          # carries a package/release id used by the status endpoint.
          result="$(jq -r '.result // empty' "$body" 2>/dev/null || true)"
          pkg_id="$(jq -r '(.id // .package_id // .message.release_file // "") | tostring' "$body" 2>/dev/null || true)"
          echo "Upload result='${result:-}' package id='${pkg_id:-}'"

          case "$result" in
            pass) echo "Splunkbase reported pass on upload."; exit 0 ;;
            fail|error) echo "Splunkbase reported '${result}' on upload." >&2; exit 1 ;;
          esac

          if [ -z "${pkg_id}" ] || [ "${pkg_id}" = "null" ]; then
            echo "No package id returned and no pass result — cannot confirm publish." >&2
            exit 1
          fi

          # Poll the read-only package status endpoint until pass/fail. GETs are
          # not subject to the POST rate limit; the loop is bounded so it never
          # hangs (20 * 30s ~= 10 min).
          status_url="https://splunkbase.splunk.com/api/v1/package/${pkg_id}/"
          for attempt in $(seq 1 20); do
            sleep 30
            s_body="$(curl -sS -u "${SPLUNK_USER}:${SPLUNK_PASS}" "$status_url" || true)"
            status="$(printf '%s' "$s_body" | jq -r '.status // .result // empty' 2>/dev/null || true)"
            echo "poll ${attempt}/20: status='${status:-unknown}'"
            case "$status" in
              pass|success|approved|complete|completed)
                echo "Splunkbase publish succeeded."; exit 0 ;;
              fail|failed|error|rejected)
                echo "Splunkbase publish failed: ${s_body}" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for Splunkbase to finish validating the release." >&2
          exit 1
