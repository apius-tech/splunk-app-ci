name: app-ci

# Reusable PR gate for Apius Splunk apps: ruff lint/format, optional pytest,
# and Splunk AppInspect (base checks) against the packaged app. Callers pass
# their app id (== the app directory name) and, optionally, a Python version.
#
# Apps that generate their Splunk app at build time (e.g. UCC add-ons, built
# with `ucc-gen build`) opt into a build step with `build_command` and point
# `package_dir` at the generated directory. Callers that set neither get
# exactly the original behaviour: no build, package `<app_id>/`.
on:
  workflow_call:
    inputs:
      app_id:
        description: "Splunk app id; also the app directory to run AppInspect against."
        required: true
        type: string
      python_version:
        description: "Python version used for the ruff/pytest tooling."
        required: false
        type: string
        default: "3.9"
      build_command:
        description: >-
          Optional shell script run from the repo root after lint/tests and
          before packaging, e.g. to generate a UCC add-on. It gets APP_ID and
          APP_VERSION (0.0.0 in the PR gate) in its environment. Empty (the
          default) skips the build step.
        required: false
        type: string
        default: ""
      package_dir:
        description: >-
          Optional path of the directory to package and inspect, e.g.
          output/<app_id> for UCC. Its last path component must equal app_id.
          Empty (the default) packages <app_id>/.
        required: false
        type: string
        default: ""

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install tooling
        run: pip install "ruff==0.15.21" "pytest>=8"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        run: |
          if [ -d tests ]; then
            pytest -q
          else
            echo "No tests/ directory found; skipping pytest."
          fi

      # AppInspect needs a package tarball, not the source directory: the
      # appinspect-cli-action globs app_path/* and inspects the first entry.
      # We build a throwaway package (version 0.0.0 is a non-release
      # placeholder; the tarball is only for inspection) into dist/ and point
      # AppInspect at that directory so it picks up the single tarball.
      - name: Fetch packaging tooling
        uses: actions/checkout@v4
        with:
          repository: apius-tech/splunk-app-ci
          ref: main
          path: .splunk-app-ci

      # Optional app build (opt-in via build_command). Runs after lint/tests so
      # generated output is never linted. APP_VERSION is the same placeholder
      # the throwaway package is stamped with.
      - name: Build app
        if: ${{ inputs.build_command != '' }}
        shell: bash
        env:
          APP_ID: ${{ inputs.app_id }}
          APP_VERSION: 0.0.0
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: bash -eo pipefail -c "$BUILD_COMMAND"

      # Pick the directory to package (package_dir, else <app_id>) and enforce
      # the ADR-0003 invariant: the tarball's single top-level directory, which
      # build_package takes from the directory name, must be the app id.
      - name: Resolve package directory
        id: pkg
        shell: bash
        env:
          APP_ID: ${{ inputs.app_id }}
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          set -euo pipefail
          dir="${PACKAGE_DIR:-$APP_ID}"
          dir="${dir%/}"
          if [ "$(basename "$dir")" != "$APP_ID" ]; then
            echo "::error::package_dir '$dir' must be a directory named after app_id '$APP_ID' (the package's top-level directory is the app id)."
            exit 1
          fi
          if [ ! -f "$dir/default/app.conf" ]; then
            echo "::error::'$dir/default/app.conf' not found. Is app_id/package_dir right, and did build_command produce the app?"
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build package for inspection
        run: PYTHONPATH=.splunk-app-ci python -m splunk_app_ci package --app-dir "${{ steps.pkg.outputs.dir }}" --version 0.0.0 --dest dist

      # This is the fast base-check PR gate: standard checks run and block on
      # errors/failures. Cloud vetting is a release-time API concern (advisory)
      # and is deliberately NOT run here. Manual checks are excluded so a
      # well-formed app PR passes the gate.
      - name: AppInspect (base checks)
        uses: splunk/appinspect-cli-action@v2.13.0
        with:
          app_path: dist
          excluded_tags: manual
          result_file: appinspect_result.json

      - name: Upload AppInspect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appinspect-report
          path: appinspect_result.json
          if-no-files-found: warn
