name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install tooling
        run: pip install "ruff==0.15.21" "pytest>=8"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Tests
        run: pytest -q
